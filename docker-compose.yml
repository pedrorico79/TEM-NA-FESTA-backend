services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: tem-na-festa-backend:latest
    container_name: tem-na-festa-app
    restart: unless-stopped
    environment:
      PORT: ${PORT}
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

