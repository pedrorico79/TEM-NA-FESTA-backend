# Configura o banco H2 em memória
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Força o Hibernate a criar as tabelas do zero a cada teste
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true

app.jwt.secret=12345678901234567890123456789012
app.jwt.expiration-ms=86400000
app.jwt.expiration-remember-ms=2592000000
app.jwt.cookie-name=auth_token
app.jwt.cookie-path=/
app.jwt.cookie-secure=false
app.jwt.cookie-same-site=Lax
app.jwt.cookie-domain=
