spring.application.name=tem-na-festa
server.port=${PORT:8080}
server.error.include-message=${SERVER_ERROR_INCLUDE_MESSAGE:never}
server.error.include-binding-errors=${SERVER_ERROR_INCLUDE_BINDING_ERRORS:never}
server.error.include-stacktrace=never
cookie.secure=${APP_COOKIE_SECURE:false}

# ===============================
# IP DO CLIENTE E LIMITE DE LOGIN
# ===============================
# Atrás de um proxy (nginx do frontend, load balancer), o IP do cliente chega no
# cabeçalho X-Forwarded-For. Com "native" o Tomcat usa esse IP quando a conexão
# vem de um proxy de confiança (redes privadas e localhost, por padrão) e ignora
# o cabeçalho nas demais. Use "none" para voltar ao IP da conexão.
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:native}
# Falhas de login toleradas antes do bloqueio: por conta (mesmo e-mail e IP) e
# por IP (qualquer e-mail). Zero desliga a regra. Para teste de carga a partir de
# uma máquina só, suba ou desligue o limite por IP (LOGIN_MAX_POR_IP=0).
app.login.max-por-conta=${LOGIN_MAX_POR_CONTA:5}
app.login.max-por-ip=${LOGIN_MAX_POR_IP:20}
app.login.janela-minutos=${LOGIN_JANELA_MINUTOS:15}
app.login.bloqueio-minutos=${LOGIN_BLOQUEIO_MINUTOS:15}
# ===============================
# CONFIGURAÇÃO DO BANCO DE DADOS (MYSQL)
# ===============================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# ===============================
# CONFIGURAÇÃO DO JPA / HIBERNATE
# ===============================
# Força o dialeto (evita o erro "Unable to determine Dialect")
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# CONFIGURAÇÕES DO JWT
# ===============================
# Defina uma chave secreta forte (pelo menos 32 caracteres) e o tempo de expiração em milissegundos
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
app.jwt.expiration-remember-ms=2592000000
app.jwt.cookie-name=auth_token
app.jwt.cookie-path=/
app.jwt.cookie-secure=${APP_JWT_COOKIE_SECURE:false}
app.jwt.cookie-same-site=Lax
app.jwt.cookie-domain=


# ===============================
# CONFIGURAÇÕES DO RABBITMQ
# ===============================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin

# =====================================================
# COMO CONFIGURAR VARIAVEIS DE AMBIENTE (INTELLIJ)
# =====================================================

# Siga os passos abaixo para configurar corretamente as variaveis de ambiente:

# 1. Abra o projeto no IntelliJ

# 2. No canto superior direito, onde aparece o nome da aplicacao,
# clique em "Edit Configurations..."

# 3. Selecione sua aplicacao Spring Boot (lado esquerdo)

# 4. Clique em "Modify options"

# 5. Marque a opcao "Environment variables"

# 6. No campo "Environment variables" que aparecer, insira as variaveis
# no seguinte formato (separadas por ponto e virgula):

#    DB_URL=jdbc:mysql://127.0.0.1:3306/nome_banco?allowPublicKeyRetrieval=true&useSSL=false;
#    DB_USER=usuario;DB_PASSWORD=senha;JWT_SECRET=c2VncmVkbzEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2;
#

# 7. Clique em "Apply" e depois em "OK"

# 8. Execute o projeto normalmente

# =====================================================
# IMPORTANTE
# =====================================================

# - As variaveis devem ser separadas por ponto e virgula (;)
# - Nao utilizar espacos desnecessarios
# - Cada desenvolvedor deve configurar suas proprias variaveis
# - Essas informacoes nao devem ser enviadas para o GitHub
# - Se alterar algo, reinicie a aplicacao
